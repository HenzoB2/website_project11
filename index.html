<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" type="x-icon" href="lester.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOLIPOP</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000; 
        }

       
        #bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%); 
            object-fit: cover;
            z-index: 1;
        }

        
        .text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); 
            color: #ffffff;
            text-align: center;
            z-index: 2;
            pointer-events: none; 
            
           
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            width: 90%; 
            max-width: 800px;
        }

        .text-overlay h1 {
            font-size: 8vw; 
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .text-overlay p {
            font-size: 3vw; 
            font-weight: normal;
        }

        @media (min-aspect-ratio: 1/1) {
            .text-overlay h1 { font-size: min(8vw, 10vh); }
            .text-overlay p { font-size: min(3vw, 4vh); }
        }

        #click-prompt {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0,0,0,0.6);
            padding: 10px 25px;
            border-radius: 30px;
            font-size: 1rem;
            z-index: 3;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .hidden {
            opacity: 0;
        }
    </style>
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

    <video autoplay loop playsinline id="bg-video">
        <source src="hack.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
    </video>

    <div class="text-overlay">
        <h1>LESTER MESSAGE</h1>
        <p>WEBSITE WAS HACKED BY UD3P OLD HENZO.</p>
    </div>

    <div id="click-prompt">Click anywhere to enable sound</div>

    <script>
        document.addEventListener('click', function() {
            const video = document.getElementById('bg-video');
            const prompt = document.getElementById('click-prompt');
            
            video.muted = false;
            prompt.classList.add('hidden');
            video.play();
        });
    </script>

</body>
</html>
